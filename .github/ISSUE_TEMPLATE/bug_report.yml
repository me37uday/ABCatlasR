name: ABCatlasR bug report
description: Report a reproducible native-R package, data-routing, download, or object-construction problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: ABCatlasR version or Git commit
      description: Run packageVersion("ABCatlasR") or provide the Git commit hash.
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset
      placeholder: e.g. MERFISH_imputed
    validations:
      required: true
  - type: dropdown
    id: data_type
    attributes:
      label: Expression representation
      options: [raw, log2, "Not applicable / metadata only", Unsure]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact R command
      render: r
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Complete error or warning
      render: text
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did the problem occur?
      options:
        - list_datasets()
        - load_data()
        - plan_fetch()
        - fetch_data() - matrix
        - fetch_data() - Seurat
        - fetch_data() - SingleCellExperiment
        - fetch_data() - SpatialExperiment
        - Cache / download
        - Installation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: R and operating-system information
      description: Paste the output of sessionInfo().
      render: text
    validations:
      required: true
  - type: dropdown
    id: cache_state
    attributes:
      label: Cache / network state
      options:
        - File was not cached
        - File was fully cached
        - Partial download existed
        - Offline mode
        - Not applicable
        - Unsure
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Include relevant cell filters, genes, release, expected behavior, and what happened instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I checked that this report does not contain credentials, tokens, or sensitive data.
          required: true
